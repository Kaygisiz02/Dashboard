<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Random Joke Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container" role="main">
    <h1>Random Joke Generator</h1>

    <div class="controls">
      <label for="category">Category:</label>
      <select id="category" aria-label="Joke category">
        <option value="Any">Any</option>
        <option value="Programming">Programming</option>
        <option value="Misc">Misc</option>
        <option value="Dark">Dark</option>
        <option value="Pun">Pun</option>
      </select>

      <button id="newJoke" class="btn">Get a joke</button>
    </div>

    <section id="jokeCard" class="joke-card" aria-live="polite">
      <p id="jokeText" class="joke-text">Click "Get a joke" to start.</p>
      <p id="jokeExtra" class="joke-extra" aria-hidden="true"></p>
    </section>

    <div class="actions">
      <button id="copyBtn" class="btn" disabled>Copy</button>
      <a id="tweetLink" class="btn disabled" target="_blank" rel="noopener">Tweet</a>
    </div>

    <p class="foot">Jokes via <a href="https://v2.jokeapi.dev" target="_blank" rel="noopener">JokeAPI</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
